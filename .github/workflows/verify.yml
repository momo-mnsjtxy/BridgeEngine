name: verify

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated binaries
        run: |
          if git ls-files | grep -E '\.(dll|exe|o|a|so|epf)$'; then
            echo "Generated binaries must not be tracked."
            exit 1
          fi
      - name: Configure regression targets
        run: >-
          cmake -S . -B build-test
          -DBRIDGEENGINE_BUILD_SHARED=OFF
          -DBRIDGEENGINE_BUILD_STATIC=OFF
           -DBRIDGEENGINE_BUILD_EXAMPLES=OFF
           -DBRIDGEENGINE_BUILD_XJ380=OFF
           -DBRIDGEENGINE_BUILD_TESTS=ON
           -DBRIDGEENGINE_ENABLE_ASAN=ON
      - name: Run regression targets
        run: cmake --build build-test && ctest --test-dir build-test --output-on-failure
      - name: Build XJ380 with the fetched SDK
        run: |
          cmake -S . -B build-xj380-fetch -DBRIDGEENGINE_BUILD_SHARED=OFF -DBRIDGEENGINE_BUILD_STATIC=OFF -DBRIDGEENGINE_BUILD_EXAMPLES=OFF -DBRIDGEENGINE_BUILD_TESTS=OFF -DBRIDGEENGINE_BUILD_XJ380=ON -DXJ380_SDK=
          cmake --build build-xj380-fetch --target xj380_staticlib
          test -d build-xj380-fetch/_deps/xj380_sdk-src/include
          test -d build-xj380-fetch/_deps/xj380_sdk-src/obj-gui

  product:
    name: product (${{ matrix.os }}, ${{ matrix.package.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package:
          - name: shared-only
            shared: 'ON'
            static: 'OFF'
          - name: static-only
            shared: 'OFF'
            static: 'ON'
          - name: shared-static
            shared: 'ON'
            static: 'ON'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux media development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev
      - name: Install macOS media development packages
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config sdl3 sdl3_image sdl3_ttf
      - name: Set up vcpkg
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
      - name: Install Windows media development packages
        if: runner.os == 'Windows'
        run: vcpkg install ffmpeg sdl3 sdl3-image sdl3-ttf --triplet x64-windows
      - name: Configure Unix product build
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build-product
           -DBRIDGEENGINE_BUILD_SHARED=${{ matrix.package.shared }}
           -DBRIDGEENGINE_BUILD_STATIC=${{ matrix.package.static }}
          -DBRIDGEENGINE_BUILD_EXAMPLES=ON
          -DBRIDGEENGINE_BUILD_TESTS=OFF
          -DBRIDGEENGINE_BUILD_XJ380=OFF
      - name: Configure Windows product build
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build-product
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
           -DBRIDGEENGINE_BUILD_SHARED=${{ matrix.package.shared }}
           -DBRIDGEENGINE_BUILD_STATIC=${{ matrix.package.static }}
          -DBRIDGEENGINE_BUILD_EXAMPLES=ON
          -DBRIDGEENGINE_BUILD_TESTS=OFF
          -DBRIDGEENGINE_BUILD_XJ380=OFF
      - name: Build product targets
        run: cmake --build build-product --config Release
      - name: Verify installed CMake package
        if: runner.os != 'Windows'
        run: >-
          cmake
          -DBUILD_DIR=build-product
          -DSOURCE_DIR=.
          -DCONSUMER_DEPENDENCY_MODE=${{ matrix.package.name }}
          -P tests/install_tree_smoke.cmake
      - name: Verify installed CMake package
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake
          -DBUILD_DIR=build-product
          -DSOURCE_DIR=.
          -DCONSUMER_DEPENDENCY_MODE=${{ matrix.package.name }}
          -DINSTALL_CONFIG=Release
          -DTOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_BIN_DIR="$env:VCPKG_ROOT/installed/x64-windows/bin"
          -P tests/install_tree_smoke.cmake
